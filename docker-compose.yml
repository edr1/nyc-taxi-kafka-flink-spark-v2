services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ["CMD-SHELL", "./opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 18
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports: ["${UI_BIND_ADDRESS:-127.0.0.1}:8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: nyc-taxi
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: 'true'
    depends_on: {kafka: {condition: service_healthy}}
  init-kafka:
    image: apache/kafka:3.9.1
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic nyc.taxi.trips --partitions 3 --replication-factor 1"]
  producer:
    build: {context: ., dockerfile: python.Dockerfile}
    command: ["python", "producer/taxi_producer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-20}
      MAX_EVENTS: ${MAX_EVENTS:-5000}
      REPLAY_RUN_ID: ${REPLAY_RUN_ID:-}
    volumes: ["./data:/app/data:ro"]
    depends_on: {init-kafka: {condition: service_completed_successfully}}
    profiles: ["ingest"]
  lake-writer:
    build: {context: ., dockerfile: python.Dockerfile}
    command: ["python", "storage/kafka_to_parquet.py"]
    environment: {KAFKA_BOOTSTRAP: "kafka:29092"}
    volumes: ["./results:/app/results"]
    depends_on: {init-kafka: {condition: service_completed_successfully}}
  jobmanager:
    build: {context: ., dockerfile: flink/Dockerfile}
    command: jobmanager
    ports: ["${UI_BIND_ADDRESS:-127.0.0.1}:8081:8081"]
    environment: {JOB_MANAGER_RPC_ADDRESS: jobmanager}
    volumes: ["./results:/opt/flink/results"]
  taskmanager:
    build: {context: ., dockerfile: flink/Dockerfile}
    command: taskmanager
    depends_on: [jobmanager]
    environment: {JOB_MANAGER_RPC_ADDRESS: jobmanager}
    volumes: ["./results:/opt/flink/results"]
  spark:
    build: {context: ., dockerfile: python.Dockerfile}
    command: ["sleep", "infinity"]
    environment:
      SPARK_CONF_DIR: /app/spark/conf
      REPLAY_RUN_ID: ${REPLAY_RUN_ID:-}
    volumes: ["./data:/app/data:ro", "./results:/app/results"]
    ports: ["${UI_BIND_ADDRESS:-127.0.0.1}:4040:4040", "${UI_BIND_ADDRESS:-127.0.0.1}:4041:4041"]
  spark-history:
    build: {context: ., dockerfile: python.Dockerfile}
    command: ["python", "spark/history_server.py"]
    environment: {SPARK_CONF_DIR: /app/spark/conf}
    volumes: ["./results:/app/results"]
    ports: ["${UI_BIND_ADDRESS:-127.0.0.1}:18080:18080"]
